# Terminal
set -g default-terminal "tmux-256color"

# Rebind prefix to C-a

unbind-key C-b

set-option -g prefix C-a

bind-key C-a send-prefix # Send C-a to the terminal when pressed twice


# Set mouse support with system clipboard support (https://unix.stackexchange.com/a/318285)
set-option -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down

# To copy, left click and drag to highlight text in yellow,
# once you release left click yellow text will disappear and will automatically be available in clibboard
# # Use vim keybindings in copy mode
setw -g mode-keys vi
# Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection c"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"


# Start windows and panes at 1, not 0 (https://unix.stackexchange.com/a/35932)
set -g base-index 1
setw -g pane-base-index 1

# Window select keybinds
bind -n C-1 select-window -t :1
bind -n C-2 select-window -t :2
bind -n C-3 select-window -t :3
bind -n C-4 select-window -t :4
bind -n C-5 select-window -t :5
bind -n C-6 select-window -t :6
bind -n C-7 select-window -t :7
bind -n C-8 select-window -t :8
bind -n C-9 select-window -t :9
bind -n C-0 select-window -t :10


# Nvim options
set-option -sg escape-time 10
set-option -g focus-events on

# Extended keys
set -s extended-keys always

# Status bar

## Window labels
set -g automatic-rename-format "#{?pane_in_mode,[tmux],#{pane_current_command}}#{?pane_dead,[dead],} [#{?#{==:#{pane_current_path},$HOME},~,#{b:pane_current_path}}]"
set -g status-left '[#{session_name}]'
set -g window-status-separator '|'
set -g window-status-format ' #I #W '
set -g window-status-current-format ' #I #W '
set -g window-status-current-style bg=colour10
